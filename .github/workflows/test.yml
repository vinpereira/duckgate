name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run pytest -v

  # keeps the duckdb>=X.Y.Z floor in pyproject.toml honest — bump both together
  test-duckdb-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # duckdb 1.3.0 predates Python 3.14 and has no wheel for it (uv would try a source
      # build and fail), so pin a Python that 1.3.0 ships wheels for
      - run: uv run --python 3.13 --with "duckdb==1.3.0" pytest -v
